name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out custom node
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest ruff

      - name: Run Ruff and compileall
        run: |
          python -m ruff check nodes.py spectrum_h3_compat.py __init__.py tests --ignore I001,UP035,UP006,UP045
          python -m compileall -q nodes.py spectrum_h3_compat.py tests

      - name: Run full test suite
        run: python -m pytest -q
